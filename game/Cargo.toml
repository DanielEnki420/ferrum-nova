[package]
name = "ferrum-nova"
version = "0.1.0"
edition = "2024"

[dependencies]
# Nur die Bevy-Teile, die das Spiel braucht (kleinere WebAssembly-Datei).
# Weggelassen: 2D, Gamepads, Picking, Szenen, Animation. Ton nur als Ogg Vorbis.
bevy = { version = "0.20.1", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "bevy_window",
    "webgl2",
    "x11",
    "wayland",
    # Schrift: eigene Fira Mono mit Umlauten (game/fonts), nicht Bevys Teilmenge ohne Umlaute
    "bevy_camera",
    "bevy_color",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_text",
    "bevy_light",
    "bevy_mikktspace",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_anti_alias",
    "smaa_luts",
    "bevy_gltf",
    "tonemapping_luts",
    "ktx2",
    "zstd_rust",
    "png",
    "jpeg",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_input_focus",
    "bevy_audio",
    "vorbis",
] }

# Im Browser: Adresse lesen, Seite neu laden, Duell über WebSocket, Link in die Zwischenablage
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.107", features = [
    "Window", "Location", "History", "Document", "Element", "Storage",
    "WebSocket", "MessageEvent", "BinaryType", "Event", "Navigator", "Clipboard", "Crypto",
] }
wasm-bindgen = "0.2.130"
js-sys = "0.3.107"

# Schnellere Debug-Builds: eigener Code leicht optimiert, Abhängigkeiten voll
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Kleinere WebAssembly-Datei für den Browser
[profile.release]
opt-level = "z"
lto = "fat"
panic = "abort"
codegen-units = 1
strip = true
