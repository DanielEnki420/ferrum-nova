[package]
name = "ferrum-nova"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"

# Schnellere Debug-Builds: eigener Code leicht optimiert, Abhängigkeiten voll
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Kleinere WebAssembly-Datei für den Browser
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
