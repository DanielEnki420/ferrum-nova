<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ferrum Nova</title>
    <link data-trunk rel="copy-dir" href="assets" />
    <link data-trunk rel="rust" data-wasm-opt="s" data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
  <style>
    html, body { margin: 0; height: 100%; background: #0d0f14; overflow: hidden; }
    #game { width: 100%; height: 100%; display: block; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0d0f14; color: #8cd9ff; font: 600 34px/1.3 system-ui, sans-serif; letter-spacing: 0.12em; z-index: 10; }
    #gl-lost { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(13, 15, 20, 0.92); color: #ff8a7a; font: 600 30px/1.3 system-ui, sans-serif; z-index: 20; text-align: center; }
    #gl-lost small { color: #c4ced8; font-size: 15px; font-weight: 400; margin: 12px 20px 22px; }
    #gl-lost button { font: 600 16px system-ui, sans-serif; padding: 10px 26px; border-radius: 6px; border: 1px solid #8cd9ff;
      background: #16202c; color: #8cd9ff; cursor: pointer; }
    #gl-lost button:hover { background: #20304a; }
    #loading small {color: #8a9aab; font-size: 14px; font-weight: 400; letter-spacing: 0.05em; margin-top: 10px; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <!-- Das Spiel blendet diesen Hinweis nach dem ersten Bild aus und vor einem Neustart wieder ein -->
  <div id="loading">FERRUM NOVA<small>wird geladen …</small></div>
  <script>
    // Browser lassen Ton erst nach einer Eingabe zu. Das Spiel legt seinen Audio-Kontext beim Start an,
    // also vorher: alle Kontexte merken und beim ersten Klick bzw. Tastendruck aufwecken.
    (() => {
      const Orig = window.AudioContext || window.webkitAudioContext;
      if (!Orig) return;
      const made = [];
      window.__audioContexts = made; // zur Fehlersuche in der Konsole
      function Tracked(...args) { const c = new Orig(...args); made.push(c); return c; }
      Tracked.prototype = Orig.prototype;
      window.AudioContext = Tracked;
      window.webkitAudioContext = Tracked;
      const wake = () => made.forEach((c) => { if (c.state !== 'running') c.resume(); });
      for (const ev of ['pointerdown', 'keydown', 'touchend']) window.addEventListener(ev, wake, { capture: true });
    })();

    // Spieldateien (Shader, Texturen, Töne) nie ungeprüft aus dem Browser-Cache nehmen: sonst passt
    // nach einem Update ein alter Shader nicht mehr zum neuen Spiel. Der Server antwortet bei
    // unveränderten Dateien nur kurz mit "304 Not Modified".
    const origFetch = window.fetch.bind(window);
    window.fetch = (input, init) => {
      const url = typeof input === 'string' ? input : input.url;
      if (url && url.includes('/assets/')) {
        return typeof input === 'string'
          ? origFetch(input, { ...init, cache: 'no-cache' })
          : origFetch(new Request(input, { cache: 'no-cache' }), init);
      }
      return origFetch(input, init);
    };

    // Verliert der Browser die Grafik (WebGL-Kontext weg, z. B. bei Überlastung der Grafikkarte),
    // kann das Spiel nicht weiterzeichnen. Statt eines schwarzen Bildes einen Hinweis mit
    // Neu-laden-Knopf zeigen.
    document.getElementById('game').addEventListener('webglcontextlost', () => {
      if (document.getElementById('gl-lost')) return;
      const box = document.createElement('div');
      box.id = 'gl-lost';
      box.innerHTML = 'Grafik abgestürzt'
        + '<small>Der Browser hat die Verbindung zur Grafikkarte verloren, meist wegen Überlastung.<br>'
        + 'Das laufende Gefecht lässt sich leider nicht fortsetzen.</small>'
        + '<button type="button">Neu laden</button>';
      box.querySelector('button').addEventListener('click', () => location.reload());
      document.body.appendChild(box);
    });

    // Kein Browser-Kontextmenü im Spiel: Rechtsklick und (auf dem Mac) Strg+Klick sind Spielbefehle
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // Mausrad, Trackpad-Wischen und Fingerspreizen auseinanderhalten.
    // Das Spiel zoomt bei Zeilen-Ereignissen und verschiebt die Kamera bei Pixel-Ereignissen.
    // Zoom (Mausrad, Fingerspreizen) wird deshalb als Zeilen-Ereignis neu ausgelöst,
    // Wischen mit zwei Fingern geht unverändert als Pixel-Ereignis weiter.
    let trackpadSeen = false;
    window.addEventListener('wheel', (e) => {
      if (!e.isTrusted || e.target.id !== 'game') return;
      let lines = null;
      if (e.ctrlKey) {
        // Fingerspreizen meldet der Browser als Mausrad mit Strg
        lines = e.deltaY / 12;
      } else if (e.deltaMode !== 0) {
        return; // Mausrad, das schon in Zeilen zählt
      } else {
        // Seitliche Bewegung gibt es nur auf dem Trackpad. Danach gilt: Rastende Räder
        // melden Vielfache von 120, alles andere ist Wischen.
        if (e.deltaX !== 0) trackpadSeen = true;
        const notched = e.wheelDeltaY && Math.abs(e.wheelDeltaY) % 120 === 0;
        if (trackpadSeen && !notched) return;
        lines = e.deltaY / 50;
      }
      e.preventDefault();
      e.stopImmediatePropagation();
      e.target.dispatchEvent(new WheelEvent('wheel', {
        deltaX: 0, deltaY: lines, deltaMode: WheelEvent.DOM_DELTA_LINE,
        clientX: e.clientX, clientY: e.clientY, bubbles: true, cancelable: true,
      }));
    }, { capture: true, passive: false });
  </script>
</body>
</html>
